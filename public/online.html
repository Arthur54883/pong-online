<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pong Online</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    font-family: Arial, sans-serif;
    color: #eee;
    padding: 20px;
  }
  h1 {
    letter-spacing: 4px;
    margin: 0 0 20px 0;
  }
  .tela {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 100%;
    max-width: 420px;
  }
  .tela.ativa {
    display: flex;
  }
  input {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    font-size: 16px;
    border-radius: 6px;
    border: 2px solid #444;
    background: #1b1b1b;
    color: #fff;
  }
  button {
    padding: 12px 28px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: #4caf50;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 6px;
  }
  button:hover {
    background: #43a047;
  }
  button.secundario {
    background: #333;
    border: 2px solid #666;
  }
  button.secundario:hover {
    background: #444;
  }
  #erroAuth {
    color: #ff6b6b;
    min-height: 20px;
    font-size: 14px;
  }
  #linkAlternar {
    color: #4caf50;
    cursor: pointer;
    text-decoration: underline;
    margin-top: 10px;
  }
  #infoMenu {
    background: #1b1b1b;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 16px 24px;
    margin-bottom: 16px;
  }
  #infoMenu .moedas {
    color: #ffcc00;
    font-weight: bold;
  }
  .quadro {
    position: relative;
    max-width: 100%;
  }
  canvas {
    background: #000;
    border: 2px solid #555;
    max-width: 100%;
    height: auto;
    touch-action: none;
  }
  #controlesToque {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 800px;
    margin-top: 10px;
  }
  .botaoToque {
    flex: 1;
    margin: 0 6px;
    padding: 22px;
    font-size: 28px;
    background: #222;
    border: 2px solid #555;
    border-radius: 10px;
    user-select: none;
  }
  #placarOnline {
    font-size: 14px;
    color: #999;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <h1>PONG ONLINE</h1>

  <!-- tela de login/registro -->
  <div id="telaAuth" class="tela ativa">
    <input id="campoUsuario" type="text" placeholder="Nome de usuário" autocomplete="username">
    <input id="campoSenha" type="password" placeholder="Senha" autocomplete="current-password">
    <p id="erroAuth"></p>
    <button id="botaoEntrar">Entrar</button>
    <span id="linkAlternar">Não tem conta? Criar uma agora</span>
  </div>

  <!-- menu principal -->
  <div id="telaMenu" class="tela">
    <div id="infoMenu">
      <p>Jogando como <strong id="nomeUsuarioMenu"></strong></p>
      <p class="moedas">Moedas: <span id="moedasMenu">0</span></p>
      <p id="recordeMenu" style="font-size:12px;color:#777;"></p>
    </div>
    <button id="botaoProcurar">Procurar Partida (online)</button>
    <button id="botaoJogarIA" class="secundario">Jogar contra o Computador</button>
    <button id="botaoSair" class="secundario">Sair da conta</button>
  </div>

  <!-- procurando oponente -->
  <div id="telaEspera" class="tela">
    <p>Procurando oponente...</p>
    <button id="botaoCancelar" class="secundario">Cancelar</button>
    <p style="font-size:12px;">
      Não quer esperar? <span class="link" id="linkJogarIAEspera" style="color:#4caf50;cursor:pointer;text-decoration:underline;">Jogue contra o computador</span>
    </p>
  </div>

  <!-- jogo -->
  <div id="telaJogo" class="tela">
    <div class="quadro">
      <canvas id="canvasJogo" width="800" height="500"></canvas>
    </div>
    <div id="controlesToque">
      <div class="botaoToque" id="botaoCima">▲</div>
      <div class="botaoToque" id="botaoBaixo">▼</div>
    </div>
    <p id="placarOnline">W/S no teclado, ou os botões ▲▼ no celular. Espaço lança a bola.</p>
  </div>

  <!-- fim de jogo -->
  <div id="telaFim" class="tela">
    <h2 id="resultadoFim"></h2>
    <p id="moedasFim"></p>
    <button id="botaoVoltarMenu">Voltar ao Menu</button>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
const LARGURA = 800;
const ALTURA = 500;
const RAQUETE_LARGURA = 12;
const RAQUETE_ALTURA = 90;

let token = localStorage.getItem("pongToken") || null;
let usuarioAtual = null;
let socket = null;
let meuIndice = null;

function mostrarTela(id) {
  document.querySelectorAll(".tela").forEach((t) => t.classList.remove("ativa"));
  document.getElementById(id).classList.add("ativa");
}

// --- autenticação ---
let modoRegistro = false;

document.getElementById("linkAlternar").addEventListener("click", () => {
  modoRegistro = !modoRegistro;
  document.getElementById("botaoEntrar").textContent = modoRegistro ? "Criar conta" : "Entrar";
  document.getElementById("linkAlternar").textContent = modoRegistro
    ? "Já tem conta? Entrar"
    : "Não tem conta? Criar uma agora";
  document.getElementById("erroAuth").textContent = "";
});

document.getElementById("botaoEntrar").addEventListener("click", async () => {
  const username = document.getElementById("campoUsuario").value.trim();
  const senha = document.getElementById("campoSenha").value;
  const rota = modoRegistro ? "/api/registrar" : "/api/login";

  try {
    const resp = await fetch(rota, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, senha })
    });
    const dados = await resp.json();
    if (!resp.ok) {
      document.getElementById("erroAuth").textContent = dados.erro || "Erro ao entrar.";
      return;
    }
    token = dados.token;
    localStorage.setItem("pongToken", token);
    usuarioAtual = dados.usuario;
    entrarNoMenu();
  } catch (e) {
    document.getElementById("erroAuth").textContent = "Não foi possível conectar ao servidor.";
  }
});

document.getElementById("botaoSair").addEventListener("click", () => {
  localStorage.removeItem("pongToken");
  token = null;
  if (socket) socket.disconnect();
  mostrarTela("telaAuth");
});

async function tentarSessaoSalva() {
  if (!token) return;
  try {
    const resp = await fetch("/api/perfil", { headers: { Authorization: `Bearer ${token}` } });
    if (!resp.ok) throw new Error();
    const dados = await resp.json();
    usuarioAtual = dados.usuario;
    entrarNoMenu();
  } catch {
    localStorage.removeItem("pongToken");
    token = null;
  }
}

function entrarNoMenu() {
  document.getElementById("nomeUsuarioMenu").textContent = usuarioAtual.username;
  document.getElementById("moedasMenu").textContent = usuarioAtual.moedas;
  document.getElementById("recordeMenu").textContent =
    `${usuarioAtual.vitorias} vitórias / ${usuarioAtual.derrotas} derrotas`;
  mostrarTela("telaMenu");
  conectarSocket();
}

// --- socket.io ---
function conectarSocket() {
  if (socket) return;
  socket = io({ auth: { token } });

  socket.on("procurandoOponente", () => mostrarTela("telaEspera"));

  socket.on("partidaEncontrada", ({ oponente, indice }) => {
    meuIndice = indice;
    document.getElementById("placarOnline").textContent =
      `Você vs ${oponente} — W/S ou ▲▼, Espaço lança a bola`;
    mostrarTela("telaJogo");
  });

  socket.on("estadoJogo", desenharEstado);

  socket.on("fimDeJogo", ({ venceu, empate, moedasGanhas }) => {
    document.getElementById("resultadoFim").textContent = empate
      ? "Empate!"
      : venceu
      ? "Você venceu!"
      : "Você perdeu.";
    document.getElementById("moedasFim").textContent = `+${moedasGanhas} moedas`;
    mostrarTela("telaFim");
  });

  socket.on("oponenteSaiu", () => {
    document.getElementById("resultadoFim").textContent = "O oponente saiu da partida.";
    document.getElementById("moedasFim").textContent = "";
    mostrarTela("telaFim");
  });
}

document.getElementById("botaoProcurar").addEventListener("click", () => {
  socket.emit("procurarPartida");
});

document.getElementById("botaoJogarIA").addEventListener("click", () => {
  window.location.href = "offline.html";
});

document.getElementById("linkJogarIAEspera").addEventListener("click", () => {
  socket.emit("cancelarBusca");
  window.location.href = "offline.html";
});

document.getElementById("botaoCancelar").addEventListener("click", () => {
  socket.emit("cancelarBusca");
  mostrarTela("telaMenu");
});

document.getElementById("botaoVoltarMenu").addEventListener("click", async () => {
  const resp = await fetch("/api/perfil", { headers: { Authorization: `Bearer ${token}` } });
  const dados = await resp.json();
  usuarioAtual = dados.usuario;
  entrarNoMenu();
});

// --- desenho do jogo (renderiza o estado que o servidor manda) ---
const canvas = document.getElementById("canvasJogo");
const ctx = canvas.getContext("2d");

function desenharEstado(estado) {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, LARGURA, ALTURA);

  ctx.strokeStyle = "#444";
  ctx.setLineDash([10, 10]);
  ctx.beginPath();
  ctx.moveTo(LARGURA / 2, 0);
  ctx.lineTo(LARGURA / 2, ALTURA);
  ctx.stroke();
  ctx.setLineDash([]);

  const minhaY = meuIndice === 0 ? estado.meuY : estado.oponenteY;
  const oponenteY = meuIndice === 0 ? estado.oponenteY : estado.meuY;

  ctx.fillStyle = "#fff";
  // jogador local sempre à esquerda na tela, oponente à direita
  ctx.fillRect(20, estado.meuY, RAQUETE_LARGURA, RAQUETE_ALTURA);
  ctx.fillRect(LARGURA - 20 - RAQUETE_LARGURA, estado.oponenteY, RAQUETE_LARGURA, RAQUETE_ALTURA);

  ctx.beginPath();
  ctx.arc(estado.bola.x, estado.bola.y, estado.bola.raio, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = "40px Arial";
  ctx.fillText(estado.meusPontos, LARGURA / 2 - 60, 50);
  ctx.fillText(estado.oponentePontos, LARGURA / 2 + 40, 50);

  const min = Math.floor(estado.tempoRestante / 60);
  const seg = estado.tempoRestante % 60;
  ctx.font = "20px Arial";
  ctx.fillStyle = "#999";
  ctx.textAlign = "center";
  ctx.fillText(`${min}:${seg.toString().padStart(2, "0")}`, LARGURA / 2, 80);
  ctx.textAlign = "left";

  if (estado.bola.parada) {
    ctx.font = "20px Arial";
    ctx.fillStyle = "#aaa";
    ctx.textAlign = "center";
    ctx.fillText("Pressione ESPAÇO (ou toque na bola) para lançar", LARGURA / 2, ALTURA / 2 + 60);
    ctx.textAlign = "left";
  }
}

// --- controles: teclado ---
document.addEventListener("keydown", (e) => {
  if (!socket || document.getElementById("telaJogo").classList.contains("ativa") === false) return;
  if (e.key === "w" || e.key === "W") socket.emit("mover", { direcao: "cima" });
  if (e.key === "s" || e.key === "S") socket.emit("mover", { direcao: "baixo" });
  if (e.key === " ") socket.emit("lancarBola");
});

document.addEventListener("keyup", (e) => {
  if (!socket) return;
  if (e.key === "w" || e.key === "W" || e.key === "s" || e.key === "S") {
    socket.emit("mover", { direcao: "parado" });
  }
});

// --- controles: toque (celular) ---
function ligarBotaoToque(elemento, direcao) {
  const iniciar = (e) => {
    e.preventDefault();
    socket.emit("mover", { direcao });
  };
  const parar = (e) => {
    e.preventDefault();
    socket.emit("mover", { direcao: "parado" });
  };
  elemento.addEventListener("touchstart", iniciar);
  elemento.addEventListener("touchend", parar);
  elemento.addEventListener("mousedown", iniciar);
  elemento.addEventListener("mouseup", parar);
  elemento.addEventListener("mouseleave", parar);
}

ligarBotaoToque(document.getElementById("botaoCima"), "cima");
ligarBotaoToque(document.getElementById("botaoBaixo"), "baixo");

canvas.addEventListener("touchstart", () => socket && socket.emit("lancarBola"));
canvas.addEventListener("click", () => socket && socket.emit("lancarBola"));

tentarSessaoSalva();
</script>
</body>
</html>
