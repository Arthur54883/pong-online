<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pong Online</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    font-family: Arial, sans-serif;
    color: #eee;
    padding: 20px;
  }
  h1 {
    letter-spacing: 4px;
    margin: 0 0 20px 0;
  }
  .tela {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 100%;
    max-width: 420px;
  }
  .tela.ativa {
    display: flex;
  }
  #telaJogo.ativa {
    max-width: 840px;
  }
  input {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    font-size: 16px;
    border-radius: 6px;
    border: 2px solid #444;
    background: #1b1b1b;
    color: #fff;
  }
  button {
    padding: 12px 28px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: #4caf50;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 6px;
  }
  button:hover {
    background: #43a047;
  }
  button.secundario {
    background: #333;
    border: 2px solid #666;
  }
  button.secundario:hover {
    background: #444;
  }
  #erroAuth {
    color: #ff6b6b;
    min-height: 20px;
    font-size: 14px;
  }
  #linkAlternar {
    color: #4caf50;
    cursor: pointer;
    text-decoration: underline;
    margin-top: 10px;
  }
  #infoMenu {
    background: #1b1b1b;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 16px 24px;
    margin-bottom: 16px;
  }
  #infoMenu .moedas {
    color: #ffcc00;
    font-weight: bold;
  }
  .quadro {
    position: relative;
    max-width: 100%;
  }
  canvas {
    background: #000;
    border: 2px solid #555;
    max-width: 100%;
    height: auto;
    touch-action: none;
  }
  #controlesToque {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 800px;
    margin-top: 10px;
  }
  .botaoToque {
    flex: 1;
    margin: 0 6px;
    padding: 22px;
    font-size: 28px;
    background: #222;
    border: 2px solid #555;
    border-radius: 10px;
    user-select: none;
  }
  #placarOnline {
    font-size: 14px;
    color: #999;
    margin-top: 8px;
  }
  #telaLoja {
    max-width: 500px;
  }
  #erroLoja {
    color: #ff6b6b;
    min-height: 20px;
    font-size: 14px;
  }
  #listaItensOnline {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    margin: 16px 0;
    max-height: 340px;
    overflow-y: auto;
  }
  .itemLoja {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #1b1b1b;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 10px 14px;
    text-align: left;
  }
  .itemInfo strong {
    color: #fff;
  }
  .itemInfo p {
    margin: 2px 0 0 0;
    font-size: 12px;
    color: #999;
  }
  .botaoComprar {
    flex-shrink: 0;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: bold;
    color: #fff;
    background: #4caf50;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin: 0;
  }
  .botaoComprar:disabled {
    background: #555;
    cursor: default;
  }
  #controlesPoder {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 800px;
    margin-top: 8px;
  }
  .botaoPoder {
    padding: 10px 4px;
    font-size: 12px;
    text-align: center;
    background: #222;
    border: 2px solid #555;
    border-radius: 8px;
    user-select: none;
  }
</style>
</head>
<body>
  <h1>PONG ONLINE</h1>

  <!-- tela de login/registro -->
  <div id="telaAuth" class="tela ativa">
    <input id="campoUsuario" type="text" placeholder="Nome de usuário" autocomplete="username">
    <input id="campoSenha" type="password" placeholder="Senha" autocomplete="current-password">
    <p id="erroAuth"></p>
    <button id="botaoEntrar">Entrar</button>
    <span id="linkAlternar">Não tem conta? Criar uma agora</span>
  </div>

  <!-- menu principal -->
  <div id="telaMenu" class="tela">
    <div id="infoMenu">
      <p>Jogando como <strong id="nomeUsuarioMenu"></strong></p>
      <p class="moedas">Moedas: <span id="moedasMenu">0</span></p>
      <p id="recordeMenu" style="font-size:12px;color:#777;"></p>
    </div>
    <button id="botaoProcurar">Procurar Partida (online)</button>
    <button id="botaoAbrirLoja" class="secundario">Loja</button>
    <button id="botaoJogarIA" class="secundario">Jogar contra o Computador</button>
    <button id="botaoSair" class="secundario">Sair da conta</button>
  </div>

  <!-- loja -->
  <div id="telaLoja" class="tela">
    <h2>LOJA</h2>
    <p>Moedas: <span class="moedas" id="moedasLoja">0</span></p>
    <p id="erroLoja"></p>
    <div id="listaItensOnline"></div>
    <button id="botaoVoltarLoja" class="secundario">Voltar</button>
  </div>

  <!-- procurando oponente -->
  <div id="telaEspera" class="tela">
    <p>Procurando oponente...</p>
    <button id="botaoCancelar" class="secundario">Cancelar</button>
    <p style="font-size:12px;">
      Não quer esperar? <span class="link" id="linkJogarIAEspera" style="color:#4caf50;cursor:pointer;text-decoration:underline;">Jogue contra o computador</span>
    </p>
  </div>

  <!-- jogo -->
  <div id="telaJogo" class="tela">
    <div class="quadro">
      <canvas id="canvasJogo" width="800" height="500"></canvas>
    </div>
    <div id="controlesToque">
      <div class="botaoToque" id="botaoCima">▲</div>
      <div class="botaoToque" id="botaoBaixo">▼</div>
    </div>
    <div id="controlesPoder"></div>
    <p id="placarOnline">W/S ou ▲▼ move &nbsp;|&nbsp; Espaço lança a bola &nbsp;|&nbsp; E,1-7: poderes</p>
  </div>

  <!-- fim de jogo -->
  <div id="telaFim" class="tela">
    <h2 id="resultadoFim"></h2>
    <p id="moedasFim"></p>
    <button id="botaoVoltarMenu">Voltar ao Menu</button>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
const LARGURA = 800;
const ALTURA = 500;
const RAQUETE_LARGURA = 12;
const RAQUETE_ALTURA = 90;

let token = localStorage.getItem("pongToken") || null;
let usuarioAtual = null;
let socket = null;
let meuIndice = null;

function mostrarTela(id) {
  document.querySelectorAll(".tela").forEach((t) => t.classList.remove("ativa"));
  document.getElementById(id).classList.add("ativa");
}

// --- autenticação ---
let modoRegistro = false;

document.getElementById("linkAlternar").addEventListener("click", () => {
  modoRegistro = !modoRegistro;
  document.getElementById("botaoEntrar").textContent = modoRegistro ? "Criar conta" : "Entrar";
  document.getElementById("linkAlternar").textContent = modoRegistro
    ? "Já tem conta? Entrar"
    : "Não tem conta? Criar uma agora";
  document.getElementById("erroAuth").textContent = "";
});

document.getElementById("botaoEntrar").addEventListener("click", async () => {
  const username = document.getElementById("campoUsuario").value.trim();
  const senha = document.getElementById("campoSenha").value;
  const rota = modoRegistro ? "/api/registrar" : "/api/login";

  try {
    const resp = await fetch(rota, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, senha })
    });
    const dados = await resp.json();
    if (!resp.ok) {
      document.getElementById("erroAuth").textContent = dados.erro || "Erro ao entrar.";
      return;
    }
    token = dados.token;
    localStorage.setItem("pongToken", token);
    usuarioAtual = dados.usuario;
    entrarNoMenu();
  } catch (e) {
    document.getElementById("erroAuth").textContent = "Não foi possível conectar ao servidor.";
  }
});

document.getElementById("botaoSair").addEventListener("click", () => {
  localStorage.removeItem("pongToken");
  token = null;
  if (socket) socket.disconnect();
  mostrarTela("telaAuth");
});

async function tentarSessaoSalva() {
  if (!token) return;
  try {
    const resp = await fetch("/api/perfil", { headers: { Authorization: `Bearer ${token}` } });
    if (!resp.ok) throw new Error();
    const dados = await resp.json();
    usuarioAtual = dados.usuario;
    entrarNoMenu();
  } catch {
    localStorage.removeItem("pongToken");
    token = null;
  }
}

function entrarNoMenu() {
  document.getElementById("nomeUsuarioMenu").textContent = usuarioAtual.username;
  document.getElementById("moedasMenu").textContent = usuarioAtual.moedas;
  document.getElementById("recordeMenu").textContent =
    `${usuarioAtual.vitorias} vitórias / ${usuarioAtual.derrotas} derrotas`;
  mostrarTela("telaMenu");
  conectarSocket();
  carregarCatalogo();
  montarBotoesPoder();
}

async function carregarCatalogo() {
  if (catalogoPoderes) return;
  try {
    const resp = await fetch("/api/loja", { headers: { Authorization: `Bearer ${token}` } });
    const dados = await resp.json();
    catalogoPoderes = dados.catalogo;
  } catch {
    // sem catálogo ainda, o HUD só não mostra nomes até conseguir carregar
  }
}

// --- socket.io ---
function conectarSocket() {
  if (socket) return;
  socket = io({ auth: { token } });

  socket.on("procurandoOponente", () => mostrarTela("telaEspera"));

  socket.on("partidaEncontrada", ({ oponente, indice }) => {
    meuIndice = indice;
    document.getElementById("placarOnline").textContent =
      `Você vs ${oponente} — W/S ou ▲▼, Espaço lança a bola`;
    mostrarTela("telaJogo");
  });

  socket.on("estadoJogo", desenharEstado);

  socket.on("fimDeJogo", ({ venceu, empate, moedasGanhas }) => {
    document.getElementById("resultadoFim").textContent = empate
      ? "Empate!"
      : venceu
      ? "Você venceu!"
      : "Você perdeu.";
    document.getElementById("moedasFim").textContent = `+${moedasGanhas} moedas`;
    mostrarTela("telaFim");
  });

  socket.on("oponenteSaiu", () => {
    document.getElementById("resultadoFim").textContent = "O oponente saiu da partida.";
    document.getElementById("moedasFim").textContent = "";
    mostrarTela("telaFim");
  });
}

document.getElementById("botaoProcurar").addEventListener("click", () => {
  socket.emit("procurarPartida");
});

document.getElementById("botaoJogarIA").addEventListener("click", () => {
  window.location.href = "offline.html";
});

document.getElementById("linkJogarIAEspera").addEventListener("click", () => {
  socket.emit("cancelarBusca");
  window.location.href = "offline.html";
});

document.getElementById("botaoCancelar").addEventListener("click", () => {
  socket.emit("cancelarBusca");
  mostrarTela("telaMenu");
});

document.getElementById("botaoVoltarMenu").addEventListener("click", async () => {
  const resp = await fetch("/api/perfil", { headers: { Authorization: `Bearer ${token}` } });
  const dados = await resp.json();
  usuarioAtual = dados.usuario;
  entrarNoMenu();
});

// --- loja ---
let catalogoPoderes = null;

async function abrirLoja() {
  mostrarTela("telaLoja");
  document.getElementById("erroLoja").textContent = "";
  try {
    const resp = await fetch("/api/loja", { headers: { Authorization: `Bearer ${token}` } });
    const dados = await resp.json();
    catalogoPoderes = dados.catalogo;
    renderizarLoja(dados.moedas, dados.poderes);
  } catch {
    document.getElementById("erroLoja").textContent = "Não foi possível carregar a loja.";
  }
}

function renderizarLoja(moedas, poderesDoUsuario) {
  document.getElementById("moedasLoja").textContent = moedas;
  const lista = document.getElementById("listaItensOnline");
  lista.innerHTML = "";

  Object.entries(catalogoPoderes).forEach(([id, def]) => {
    const nivel = poderesDoUsuario[id] || 0;
    const maxNivel = def.niveis.length;
    const noMaximo = nivel >= maxNivel;
    const proximoCfg = noMaximo ? null : def.niveis[nivel];

    const card = document.createElement("div");
    card.className = "itemLoja";

    const info = document.createElement("div");
    info.className = "itemInfo";
    const teclaTexto = def.tecla ? `tecla ${def.tecla.toUpperCase()}` : "automático";
    info.innerHTML = `<strong>${def.nome}</strong> (${teclaTexto})<p>Nível ${nivel}/${maxNivel}</p>`;

    const botao = document.createElement("button");
    botao.className = "botaoComprar";
    if (noMaximo) {
      botao.disabled = true;
      botao.textContent = "Nível máximo";
    } else {
      botao.disabled = moedas < proximoCfg.custo;
      botao.textContent = `${nivel === 0 ? "Comprar" : "Evoluir"} (${proximoCfg.custo})`;
      botao.addEventListener("click", async () => {
        try {
          const resp = await fetch("/api/comprar", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ poderId: id })
          });
          const dados = await resp.json();
          if (!resp.ok) {
            document.getElementById("erroLoja").textContent = dados.erro || "Erro ao comprar.";
            return;
          }
          document.getElementById("erroLoja").textContent = "";
          renderizarLoja(dados.moedas, dados.poderes);
        } catch {
          document.getElementById("erroLoja").textContent = "Não foi possível conectar ao servidor.";
        }
      });
    }

    card.appendChild(info);
    card.appendChild(botao);
    lista.appendChild(card);
  });
}

document.getElementById("botaoAbrirLoja").addEventListener("click", abrirLoja);

document.getElementById("botaoVoltarLoja").addEventListener("click", async () => {
  const resp = await fetch("/api/perfil", { headers: { Authorization: `Bearer ${token}` } });
  const dados = await resp.json();
  usuarioAtual = dados.usuario;
  document.getElementById("moedasMenu").textContent = usuarioAtual.moedas;
  mostrarTela("telaMenu");
});

// --- desenho do jogo (renderiza o estado que o servidor manda) ---
const canvas = document.getElementById("canvasJogo");
const ctx = canvas.getContext("2d");

function desenharEstado(estado) {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, LARGURA, ALTURA);

  ctx.strokeStyle = "#444";
  ctx.setLineDash([10, 10]);
  ctx.beginPath();
  ctx.moveTo(LARGURA / 2, 0);
  ctx.lineTo(LARGURA / 2, ALTURA);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = "#fff";
  // jogador local sempre à esquerda na tela, oponente à direita
  ctx.fillRect(20, estado.meuY, RAQUETE_LARGURA, estado.minhaAltura);
  ctx.fillRect(LARGURA - 20 - RAQUETE_LARGURA, estado.oponenteY, RAQUETE_LARGURA, estado.oponenteAltura);

  // o servidor manda a posição "real" (jogador 1 sempre à esquerda de verdade).
  // como aqui desenhamos "eu" sempre à esquerda na tela, quem for o jogador 2 de
  // verdade precisa ver a bola espelhada, senão ela nunca parece chegar na raquete certa.
  const espelhar = (x) => (meuIndice === 1 ? LARGURA - x : x);

  // bola principal — invisível se a Bola Fantasma do oponente estiver ativa contra mim
  if (!estado.bola.oculta) {
    ctx.beginPath();
    ctx.arc(espelhar(estado.bola.x), estado.bola.y, estado.bola.raio, 0, Math.PI * 2);
    ctx.fill();
  }

  // bolas extras do Multi-bola
  (estado.bolasExtras || []).forEach((b) => {
    ctx.beginPath();
    ctx.arc(espelhar(b.x), b.y, b.raio, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.font = "40px Arial";
  ctx.fillText(estado.meusPontos, LARGURA / 2 - 60, 50);
  ctx.fillText(estado.oponentePontos, LARGURA / 2 + 40, 50);

  const min = Math.floor(estado.tempoRestante / 60);
  const seg = estado.tempoRestante % 60;
  ctx.font = "20px Arial";
  ctx.fillStyle = "#999";
  ctx.textAlign = "center";
  ctx.fillText(`${min}:${seg.toString().padStart(2, "0")}`, LARGURA / 2, 80);
  ctx.textAlign = "left";

  // status dos poderes comprados (canto superior esquerdo)
  ctx.font = "13px Arial";
  let yStatus = 105;
  Object.entries(estado.meusPoderes || {}).forEach(([id, p]) => {
    if (p.nivel === 0 || !catalogoPoderes) return;
    const def = catalogoPoderes[id];
    const tecla = def.tecla ? `[${def.tecla.toUpperCase()}] ` : "";

    let texto;
    let cor;
    if (p.armado) {
      texto = `${tecla}${def.nome}: ARMADO`;
      cor = "#ffcc00";
    } else if (p.ativo) {
      texto = `${tecla}${def.nome}: ativo (${p.tempoRestanteEfeito.toFixed(1)}s)`;
      cor = "#4caf50";
    } else if (p.cooldownRestante > 0) {
      texto = `${tecla}${def.nome}: ${p.cooldownRestante.toFixed(1)}s`;
      cor = "#777";
    } else {
      texto = `${tecla}${def.nome}: pronto`;
      cor = "#4caf50";
    }

    ctx.fillStyle = cor;
    ctx.fillText(texto, 20, yStatus);
    yStatus += 15;
  });

  // mensagem de Sorte ou Escudo
  if (estado.mensagem) {
    ctx.font = "22px Arial";
    ctx.fillStyle = estado.mensagem.cor;
    ctx.textAlign = "center";
    ctx.fillText(estado.mensagem.texto, LARGURA / 2, ALTURA / 2 - 60);
    ctx.textAlign = "left";
  }

  if (estado.bola.parada) {
    ctx.font = "20px Arial";
    ctx.fillStyle = "#aaa";
    ctx.textAlign = "center";
    ctx.fillText("Pressione ESPAÇO (ou toque na bola) para lançar", LARGURA / 2, ALTURA / 2 + 60);
    ctx.textAlign = "left";
  }
}

// --- poderes: teclado e botões de toque ---
const TECLA_PARA_PODER = {
  e: "superChute",
  "1": "raqueteGrande",
  "2": "cameraLenta",
  "3": "congelarOponente",
  "4": "bolaFantasma",
  "5": "multibola",
  "6": "congelarBola",
  "7": "sorte"
};

function montarBotoesPoder() {
  const container = document.getElementById("controlesPoder");
  container.innerHTML = "";
  Object.entries(TECLA_PARA_PODER).forEach(([tecla, poderId]) => {
    const botao = document.createElement("div");
    botao.className = "botaoPoder";
    botao.textContent = tecla.toUpperCase();
    const usar = (e) => {
      e.preventDefault();
      if (socket) socket.emit("usarPoder", { poderId });
    };
    botao.addEventListener("touchstart", usar);
    botao.addEventListener("click", usar);
    container.appendChild(botao);
  });
}

// --- controles: teclado ---
document.addEventListener("keydown", (e) => {
  if (!socket || document.getElementById("telaJogo").classList.contains("ativa") === false) return;
  if (e.key === "w" || e.key === "W") socket.emit("mover", { direcao: "cima" });
  if (e.key === "s" || e.key === "S") socket.emit("mover", { direcao: "baixo" });
  if (e.key === " ") socket.emit("lancarBola");

  const tecla = e.key.toLowerCase();
  if (TECLA_PARA_PODER[tecla]) {
    socket.emit("usarPoder", { poderId: TECLA_PARA_PODER[tecla] });
  }
});

document.addEventListener("keyup", (e) => {
  if (!socket) return;
  if (e.key === "w" || e.key === "W" || e.key === "s" || e.key === "S") {
    socket.emit("mover", { direcao: "parado" });
  }
});

// --- controles: toque (celular) ---
function ligarBotaoToque(elemento, direcao) {
  const iniciar = (e) => {
    e.preventDefault();
    socket.emit("mover", { direcao });
  };
  const parar = (e) => {
    e.preventDefault();
    socket.emit("mover", { direcao: "parado" });
  };
  elemento.addEventListener("touchstart", iniciar);
  elemento.addEventListener("touchend", parar);
  elemento.addEventListener("mousedown", iniciar);
  elemento.addEventListener("mouseup", parar);
  elemento.addEventListener("mouseleave", parar);
}

ligarBotaoToque(document.getElementById("botaoCima"), "cima");
ligarBotaoToque(document.getElementById("botaoBaixo"), "baixo");

canvas.addEventListener("touchstart", () => socket && socket.emit("lancarBola"));
canvas.addEventListener("click", () => socket && socket.emit("lancarBola"));

tentarSessaoSalva();
</script>
</body>
</html>
